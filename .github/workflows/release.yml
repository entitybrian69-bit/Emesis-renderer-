name: Publish Emesis Renderer Release

# Run manually only after the release owner has approved publication.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  attach-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: v2.0

      - name: Verify and attach v2.0 APK to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="EmesisRenderer-Universal-v2.0.apk"
          echo "8b8028f6a612e0ec12241b2d76553d44fac8bdca80fe5b950375d5fa07a9f923  ${APK}" | sha256sum -c -
          gh release view v2.0 >/dev/null
          gh release upload v2.0 "${APK}"
