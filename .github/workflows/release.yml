name: Publish Emesis Renderer Release

on:
  push:
    branches:
      - "arena/fac24748-emesis-renderer"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Emesis Renderer
        uses: actions/checkout@v4

      - name: Verify Universal Plugin APK
        run: |
          test -f EmesisRenderer-Universal-v1.1.0.apk
          ls -lh EmesisRenderer-Universal-v1.1.0.apk
          sha256sum EmesisRenderer-Universal-v1.1.0.apk

      - name: Create or Update GitHub Release v1.1.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - << 'PY'
          import hashlib, pathlib, textwrap

          apk = pathlib.Path("EmesisRenderer-Universal-v1.1.0.apk")
          sha256 = hashlib.sha256(apk.read_bytes()).hexdigest()

          notes = textwrap.dedent(f"""\
          <div align="center">
            <img src="https://raw.githubusercontent.com/entitybrian69-bit/Emesis-renderer-/arena/fac24748-emesis-renderer/assets/emesis_logo.png" alt="Emesis Renderer — Made by Entitybrian" width="240" />

            # Emesis Renderer v1.1.0 — `<1.17` Shader Accelerator Update
            ### **Made by Entitybrian**
          </div>

          **Emesis Renderer v1.1.0** is a universal all-in-one Android Minecraft: Java Edition launcher renderer plugin APK created by **Entitybrian**, compatible across **all variants of Pojav** and 32-bit / 64-bit Android devices, now featuring the **High-Efficiency `< 1.17` Shader Accelerator Engine** (`1.6.4` – `1.7.10` – `1.8.9` – `1.12.2` – `1.16.5`).

          ---

          ### Highlights
          - **Automatic All-Versions Rendering:** Detects the active Minecraft version at launch (including pre-1.14 archives, `version.json`, modloader properties, and launcher env vars) and routes in one go:
            - **Minecraft `> 1.16.5`** *(1.17 – 1.21.x, 26.x+)* — **Emesis Modern Core** (`libemesis_modern.so`, OpenGL 3.2+ Core Profile over OpenGL ES 3.x with automatic GLES 3.2 / 3.1 / 3.0 context promotion)
            - **Minecraft `<= 1.16.5`** *(Classic, Beta, 1.6.4, 1.7.10, 1.8.9, 1.12.2, 1.16.5)* — **Emesis Compatibility Core** (`libemesis_legacy.so`, High-Throughput GLES 3.2/3.1/3.0 + SPIR-V ESSL Shader Accelerator with 32-bit GLES 2.0 fallback)
          - **High-Efficiency `< 1.17` Shader Acceleration (ShadersMod, OptiFine, Angelica, Oculus):**
            - **Persistent Two-Tier `.ec1` Shader Cache + `.ep1` GPU Program Binary (`glProgramBinary`) Cache + `.emesis_fpe.psa` Archive:** Eliminates world-load & shader-switch compilation stutter (~1,500x faster RAM hits, >140x faster disk hits, direct GPU ISA reload).
            - **Broad `< 1.17` GLSL 110–460 Compatibility (`glslang` + `SPIRV-Cross` -> ESSL 300/310/320 es):** Full support for 16-target MRT `gl_FragData`/`layout(location=N)`, `GL_EXT_gpu_shader4` (`texelFetch2D`, `textureSize2D`, bitwise ops), `GL_ARB_shader_texture_lod`, uniform default initializers, O(1) uniform hash lookup, and native `#version 300 es` passthrough.
            - **Mobile TBDR GPU Optimizations:** FBO attachment/`glDrawBuffers` state-diffing + bloom mip-level rendering, persistent GPU `GL_QUADS` index buffers (`uint16`/`uint32`), hardware PCF `sampler2DShadow` shadows, and HDR `RGBA16F`/`RGBA32F` linear float filtering.
          - **Universal Android Architecture Support (Including 32-bit Devices):**
            - `armeabi-v7a` (32-bit ARM)
            - `arm64-v8a` (64-bit ARM)
            - `x86` (32-bit Intel/AMD)
            - `x86_64` (64-bit Intel/AMD)
          - **Compatible With All Variants of Pojav:**
            - **Plugin V2 (`fclPlugin_V2`):** **ZalithLauncher 2**, **FoldCraftLauncher (V2)**, and V2 forks (with native in-launcher plugin settings UI)
            - **Plugin V1 (`pgwRendererPlugin` / `zalithRendererPlugin` / `fclPlugin`):** **Pojav Glow Worm (PGW / PojavZH)**, **PojavLauncher Beta / Zink**, **Pojav Firefly**, **ZalithLauncher 1**, and **Boat/Pojav hybrids**
            - **Vanilla Pojav `custom_env.txt` Bridge:** **Official PojavLauncher**, **Amethyst**, **MojoLauncher**, **SolCraftLauncher**, and **QuestCraft** (includes one-tap `custom_env.txt` generator & installer inside the Emesis Renderer app)

          ---

          ### Package Details
          - **Asset:** `EmesisRenderer-Universal-v1.1.0.apk`
          - **Application ID:** `com.entitybrian.emesis` (`versionName "1.1.0"`, `versionCode 110`, `minSdkVersion 21`, `targetSdkVersion 34`, signed v1 + v2 + v3)
          - **SHA-256:** `{sha256}`
          """)

          pathlib.Path("/tmp/release_notes.md").write_text(notes, encoding="utf-8")
          PY

          if gh release view v1.1.0 >/dev/null 2>&1; then
            gh release edit v1.1.0 \
              --title "Emesis Renderer v1.1.0 — Made by Entitybrian" \
              --notes-file /tmp/release_notes.md \
              --latest
            gh release upload v1.1.0 EmesisRenderer-Universal-v1.1.0.apk --clobber
          else
            gh release create v1.1.0 EmesisRenderer-Universal-v1.1.0.apk \
              --target "${GITHUB_SHA}" \
              --title "Emesis Renderer v1.1.0 — Made by Entitybrian" \
              --notes-file /tmp/release_notes.md \
              --latest
          fi
