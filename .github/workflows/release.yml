name: Publish Emesis Renderer Release

on:
  push:
    branches:
      - "arena/fac24748-emesis-renderer"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Emesis Renderer
        uses: actions/checkout@v4

      - name: Verify Universal Plugin APK
        run: |
          test -f EmesisRenderer-Universal-v1.1.1.apk
          ls -lh EmesisRenderer-Universal-v1.1.1.apk
          sha256sum EmesisRenderer-Universal-v1.1.1.apk

      - name: Create or Update GitHub Release v1.1.1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - << 'PY'
          import hashlib, pathlib, textwrap

          apk = pathlib.Path("EmesisRenderer-Universal-v1.1.1.apk")
          sha256 = hashlib.sha256(apk.read_bytes()).hexdigest()

          notes = textwrap.dedent(f"""\
          <div align="center">
            <img src="https://raw.githubusercontent.com/entitybrian69-bit/Emesis-renderer-/arena/fac24748-emesis-renderer/assets/emesis_logo.png" alt="Emesis Renderer — Made by Entitybrian" width="240" />

            # Emesis Renderer v1.1.1 — Scoped Storage Pojav Installer & Sodium/Iris `<1.17` Fix
            ### **Made by Entitybrian**
          </div>

          **Emesis Renderer v1.1.1** is a universal all-in-one Android Minecraft: Java Edition launcher renderer plugin APK created by **Entitybrian**, compatible across **all variants of Pojav** and 32-bit / 64-bit Android devices, with full `< 1.17` Shader Acceleration (`1.6.4` – `1.7.10` – `1.8.9` – `1.12.2` – `1.16.5`) and `> 1.16.5` Modern Core rendering (`1.17` – `1.21.x`, `26.x+`).

          ---

          ### What's New in v1.1.1
          - **One-Tap Android 11–16 Scoped Storage Pojav SAF Installer (`FolderProvider`):**
            -Directly installs and updates `custom_env.txt` inside `Android/data/net.kdt.pojavlaunch[.debug]/files/` (and Amethyst / MojoLauncher) via Android's Storage Access Framework (`FolderProvider`), bypassing Android 11–16 Scoped Storage restrictions and automatically re-syncing `nativeLibraryDir` paths across future APK updates.
          - **Automatic LWJGL 2 & LWJGL 3 OpenGL Library Binding + `POJAV_RENDERER=opengles2` Enforcement:**
            - Overrides launcher-forced `-Dorg.lwjgl.opengl.libname` flags via both `_JAVA_OPTIONS` and native JNI (`Configuration.OPENGL_LIBRARY_NAME` + `DynamicLinkLoader.ndlopen`), preventing Official PojavLauncher / Debug from accidentally falling into raw `libGLESv2.so` (`No context is current` crash) or stock `libgl4es_114.so`.
          - **Fixed Sodium `0.2.0` + Iris `1.4.5` + OptiFine / Angelica / Oculus on Minecraft `<= 1.16.5`:**
            - Strict per-backend OpenGL `GetProcAddress` & `dlsym` capability isolation (`243` universal core forwarders + dynamic backend symbol lookup) prevents LWJGL 3 `GLCapabilities` from enabling unsupported OpenGL 4.5 DSA / compute paths on `<= 1.16.5` while exposing full OpenGL 3.1 + `226` `ARB` shader/buffer/framebuffer symbols.
          - **External Hardware `EGLContext` Auto-Adoption (`> 1.16.5`):**
            - Automatically adopts externally-bound hardware `EGLContext` handles created by launcher bridges across all Pojav variants.

          ---

          ### Core Features
          - **Automatic All-Versions Rendering:**
            - **Minecraft `> 1.16.5`** *(1.17 – 1.21.x, 26.x+)* — **Emesis Modern Core** (`libemesis_modern.so`, OpenGL 3.2+ Core Profile over OpenGL ES 3.x)
            - **Minecraft `<= 1.16.5`** *(Classic, Beta, 1.6.4, 1.7.10, 1.8.9, 1.12.2, 1.16.5)* — **Emesis Compatibility Core** (`libemesis_legacy.so`, High-Throughput GLES 3.2/3.1/3.0 + SPIR-V ESSL Shader Accelerator with persistent `.ec1`/`.ep1` shader & GPU binary cache, 16-MRT FBO state-diffing, GPU `GL_QUADS` IBO, and hardware PCF shadows)
          - **Universal Android Architecture Support (Including 32-bit Devices):**
            - `armeabi-v7a` (32-bit ARM), `arm64-v8a` (64-bit ARM), `x86` (32-bit Intel/AMD), `x86_64` (64-bit Intel/AMD)
          - **Compatible With All Variants of Pojav:**
            - **Plugin V2 (`fclPlugin_V2`):** ZalithLauncher 2, FoldCraftLauncher (V2)
            - **Plugin V1 (`pgwRendererPlugin` / `zalithRendererPlugin` / `fclPlugin`):** Pojav Glow Worm (PGW / PojavZH), PojavLauncher Beta / Zink, Pojav Firefly, ZalithLauncher 1
            - **Scoped Storage SAF `custom_env.txt` Installer:** Official PojavLauncher, PojavLauncher Debug/Nightly, Amethyst, MojoLauncher, SolCraftLauncher, QuestCraft

          ---

          ### Package Details
          - **Asset:** `EmesisRenderer-Universal-v1.1.1.apk`
          - **Application ID:** `com.entitybrian.emesis` (`versionName "1.1.1"`, `versionCode 111`, `minSdkVersion 21`, `targetSdkVersion 34`, signed v1 + v2 + v3 with persistent release key)
          - **SHA-256:** `{sha256}`
          """)

          pathlib.Path("/tmp/release_notes.md").write_text(notes, encoding="utf-8")
          PY

          if gh release view v1.1.1 >/dev/null 2>&1; then
            gh release edit v1.1.1 \
              --title "Emesis Renderer v1.1.1 — Made by Entitybrian" \
              --notes-file /tmp/release_notes.md \
              --latest
            gh release upload v1.1.1 EmesisRenderer-Universal-v1.1.1.apk --clobber
          else
            gh release create v1.1.1 EmesisRenderer-Universal-v1.1.1.apk \
              --target "${GITHUB_SHA}" \
              --title "Emesis Renderer v1.1.1 — Made by Entitybrian" \
              --notes-file /tmp/release_notes.md \
              --latest
          fi
