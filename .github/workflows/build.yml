name: Verify Emesis Renderer Universal APK

on:
  pull_request:
  workflow_dispatch:

jobs:
  verify-universal-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Emesis Renderer
        uses: actions/checkout@v4

      - name: Verify Signed Universal APK & All 4 ABIs
        run: |
          test -f EmesisRenderer-Universal-v1.2.0.apk
          python3 - << 'PY'
          import zipfile
          expected_abis = ["armeabi-v7a", "arm64-v8a", "x86", "x86_64"]
          expected_libs = ["libemesis_renderer.so", "libemesis_modern.so", "libemesis_legacy.so"]
          with zipfile.ZipFile("EmesisRenderer-Universal-v1.2.0.apk", "r") as zf:
              names = set(zf.namelist())
              assert "AndroidManifest.xml" in names
              assert "classes.dex" in names
              assert "resources.arsc" in names
              for abi in expected_abis:
                  for lib in expected_libs:
                      entry = f"lib/{abi}/{lib}"
                      assert entry in names, f"Missing {entry}"
          print("Verified Universal APK structure across all 4 ABIs!")
          PY
