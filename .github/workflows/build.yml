name: Build Emesis Renderer Universal APK

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build-universal-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Emesis Renderer
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Typed OpenGL Forwarders
        run: python3 tools/gen_gl_forwards.py

      - name: Build Universal Plugin APK (armeabi-v7a, arm64-v8a, x86, x86_64)
        run: gradle assembleRelease --no-daemon

      - name: Upload Emesis Renderer Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: EmesisRenderer-Universal-APK
          path: app/build/outputs/apk/release/*.apk
